blueprint:
  name: Automatic switch restart
  description: >-
    Switches something back on after it turns itself off, waiting longer between
    each attempt, with optional notifications.
  domain: automation
  author: driin0
  homeassistant:
    # notify.send_message and the notify entity platform arrived in 2024.6.
    min_version: 2024.6.0
  input:
    switch_entity:
      name: Switch to monitor
      description: The switch to restart automatically when it turns off
      selector:
        entity:
          domain:
          - switch
          multiple: false
          reorder: false
    switch_name_custom:
      name: Custom switch name
      description: Name to use in notifications instead of the entity's own name
      default: ''
      selector:
        text:
          multiple: false
          multiline: false
    boolean_entity:
      name: Control boolean
      description: >-
        An input_boolean that enables automatic restarting. It is switched OFF while
        attempts are in progress and back ON only on success, so any other outcome
        leaves restarting disabled until you re-enable it yourself.
      selector:
        entity:
          domain:
          - input_boolean
          multiple: false
          reorder: false
    auto_restart_delay:
      name: Delay before the first attempt
      description: How long to wait before trying to switch it back on
      default: 5
      selector:
        number:
          min: 0.0
          max: 60.0
          unit_of_measurement: seconds
          step: 1.0
          mode: slider
    auto_restart_multiplier:
      name: Delay multiplier
      description: >-
        Each attempt waits this many times longer than the previous one.
        With a 5 s delay and a multiplier of 2: 5 s, then 10 s, then 20 s.
        Growth is fast, so it is capped by the setting below.
      default: 2.0
      selector:
        number:
          min: 1.0
          max: 10.0
          step: 0.1
          mode: slider
    auto_restart_max_delay:
      name: Longest delay between attempts
      description: >-
        The waiting time never grows beyond this, however many attempts remain.
        Without a cap an exponential delay reaches absurd values: at 20 s with a
        multiplier of 3, the eighth attempt would land 18 hours after the trip.
      default: 3600
      selector:
        number:
          min: 60.0
          max: 86400.0
          unit_of_measurement: seconds
          step: 60.0
          mode: box
    reachability_timeout:
      name: Give up waiting after
      description: >-
        How long to wait for the device to come back and report the state of the
        switch again. Without this limit the automation would wait forever on a
        device that never returns, and since it runs in single mode it would also
        block every later trip from being handled.
      default: 300
      selector:
        number:
          min: 10.0
          max: 3600.0
          unit_of_measurement: seconds
          step: 10.0
          mode: box
    settle_delay:
      name: Settle time after restarting
      description: >-
        How long to let the device settle after switching it back on, before
        checking that it is reachable again
      default: 10
      selector:
        number:
          min: 0.0
          max: 300.0
          unit_of_measurement: seconds
          step: 1.0
          mode: box
    auto_restart_timeout:
      name: Success timeout
      description: How long the circuit must stay up before the attempt counts as successful
      default: 30
      selector:
        number:
          min: 1.0
          max: 60.0
          unit_of_measurement: seconds
          step: 1.0
          mode: slider
    max_attempts:
      name: Number of attempts
      description: How many times to try before giving up and leaving restarting disabled
      default: 3
      selector:
        number:
          min: 1.0
          max: 10.0
          step: 1.0
          mode: slider
    binary_sensor_entity:
      name: Connectivity sensor
      description: >-
        Optional. A binary_sensor or device_tracker that reports whether the switch
        is reachable. Useful when the device drops off the network while it has no
        power.
      default: ''
      selector:
        entity:
          domain:
          - binary_sensor
          - device_tracker
          multiple: false
          reorder: false
    enable_notifications:
      name: Send notifications
      description: >-
        Notify at each stage: tripped, restarted, attempt failed, gave up
      default: false
      selector:
        boolean: {}
    notify_target:
      name: Notification target
      description: >-
        The notify entity that receives the messages. Mobile-app notify entities
        exist from Home Assistant 2026.5; on earlier versions use one from another
        integration.
      default: notify.person
      selector:
        entity:
          domain:
          - notify
          multiple: false
          reorder: false
    notify_title_off:
      name: Title - switch tripped
      description: Notification title when the switch turns off
      default: '*⚠️ {{switch_name}} tripped ⚠️*'
      selector:
        text:
          multiple: false
          multiline: false
    notify_message_off:
      name: Message - switch tripped
      description: Notification message when the switch turns off
      default: '{{switch_name}} turned off. A first restart attempt will be made.'
      selector:
        text:
          multiple: false
          multiline: false
    notify_title_on:
      name: Title - restart succeeded
      description: Notification title when the restart succeeds
      default: "*\U0001F7E2 {{switch_name}} restarted \U0001F7E2*"
      selector:
        text:
          multiple: false
          multiline: false
    notify_message_on:
      name: Message - restart succeeded
      description: Notification message when the restart succeeds
      default: '{{switch_name}} was restarted successfully after {{current_attempt}} attempt(s).'
      selector:
        text:
          multiple: false
          multiline: false
    notify_title_fail_retry:
      name: Title - attempt failed
      description: Notification title when an attempt fails
      default: '*⚠️ {{switch_name}} restart attempt failed ⚠️*'
      selector:
        text:
          multiple: false
          multiline: false
    notify_message_fail_retry:
      name: Message - attempt failed
      description: Notification message when an attempt fails
      default: '{{switch_name}} tripped again after being restarted. Trying again - attempt {{next_attempt}} of {{max_attempts}}.'
      selector:
        text:
          multiple: false
          multiline: false
    notify_title_unreachable:
      name: Title - device never returned
      description: Notification title when the device does not come back
      default: "*\U0001F534 {{switch_name}} unreachable \U0001F534*"
      selector:
        text:
          multiple: false
          multiline: false
    notify_message_unreachable:
      name: Message - device never returned
      description: Notification message when the device does not come back
      default: '{{switch_name}} did not become reachable again in time. Automatic restarting has been left disabled.'
      selector:
        text:
          multiple: false
          multiline: false
    notify_title_fail:
      name: Title - gave up
      description: Notification title when restarting is given up
      default: "*\U0001F534 {{switch_name}} restart failed \U0001F534*"
      selector:
        text:
          multiple: false
          multiline: false
    notify_message_fail:
      name: Message - gave up
      description: Notification message when restarting is given up
      default: '{{switch_name}} tripped again after being restarted. Automatic restarting has been left disabled.'
      selector:
        text:
          multiple: false
          multiline: false
  source_url: https://github.com/driin0/home-assistant-blueprints/blob/main/automatic_switch_restart.yaml
variables:
  switch_entity: !input switch_entity
  binary_sensor_entity: !input binary_sensor_entity
  switch_name_custom: !input switch_name_custom
  auto_restart_delay: !input auto_restart_delay
  auto_restart_multiplier: !input auto_restart_multiplier
  auto_restart_timeout: !input auto_restart_timeout
  auto_restart_max_delay: !input auto_restart_max_delay
  reachability_timeout: !input reachability_timeout
  settle_delay: !input settle_delay
  enable_notifications: !input enable_notifications
  max_attempts: !input max_attempts
  switch_name: "{% if switch_name_custom == '' %}\n  {{ states[switch_entity].name
    | lower }}\n{% else %}\n  {{ switch_name_custom }}\n{% endif %}\n"
trigger:
- platform: state
  entity_id: !input switch_entity
  from: 'on'
  to: 'off'
condition:
- condition: state
  entity_id: !input boolean_entity
  state: 'on'
action:
- choose:
  - conditions:
    - condition: template
      value_template: '{{ enable_notifications }}'
    sequence:
    - service: notify.send_message
      target:
        entity_id: !input notify_target
      data:
        title: !input notify_title_off
        message: !input notify_message_off
- service: input_boolean.turn_off
  target:
    entity_id: !input boolean_entity
- repeat:
    count: !input max_attempts
    sequence:
    - variables:
        current_attempt: '{{ repeat.index }}'
        next_attempt: '{{ current_attempt + 1 }}'
        dynamic_delay: '{{ [ (auto_restart_delay * (auto_restart_multiplier ** (current_attempt
          - 1))), auto_restart_max_delay ] | min | int }}'
    - delay:
        seconds: '{{ dynamic_delay }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ binary_sensor_entity != '''' }}'
        sequence:
        - wait_template: '{{ states(binary_sensor_entity) in [''on'', ''home''] }}'
          timeout:
            seconds: '{{ reachability_timeout }}'
          continue_on_timeout: true
        - wait_template: '{{ is_state(switch_entity, ''off'') }}'
          timeout:
            seconds: '{{ reachability_timeout }}'
          continue_on_timeout: true
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not (states(binary_sensor_entity) in [''on'', ''home''] and is_state(switch_entity,
                ''off'')) }}'
            sequence:
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ enable_notifications }}'
                sequence:
                - service: notify.send_message
                  target:
                    entity_id: !input notify_target
                  data:
                    title: !input notify_title_unreachable
                    message: !input notify_message_unreachable
            - stop: device never became reachable
    - service: switch.turn_on
      target:
        entity_id: !input switch_entity
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ binary_sensor_entity != '''' }}'
        sequence:
        - delay:
            seconds: '{{ settle_delay }}'
        - wait_template: '{{ states(binary_sensor_entity) in [''on'', ''home''] }}'
          timeout:
            seconds: '{{ reachability_timeout }}'
          continue_on_timeout: true
    - wait_for_trigger:
      - platform: state
        entity_id: !input switch_entity
        to: 'off'
      timeout:
        seconds: !input auto_restart_timeout
    - choose:
      - conditions:
        - condition: state
          entity_id: !input switch_entity
          state: 'on'
        sequence:
        - service: input_boolean.turn_on
          target:
            entity_id: !input boolean_entity
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ enable_notifications }}'
            sequence:
            - service: notify.send_message
              target:
                entity_id: !input notify_target
              data:
                title: !input notify_title_on
                message: !input notify_message_on
        - stop: true
      default:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ enable_notifications }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ current_attempt < max_attempts }}'
              sequence:
              - service: notify.send_message
                target:
                  entity_id: !input notify_target
                data:
                  title: !input notify_title_fail_retry
                  message: !input notify_message_fail_retry
            default:
            - service: notify.send_message
              target:
                entity_id: !input notify_target
              data:
                title: !input notify_title_fail
                message: !input notify_message_fail

# single is deliberate: overlapping restart cycles on the same switch would
# fight each other. That is why every wait above has a timeout.
mode: single
